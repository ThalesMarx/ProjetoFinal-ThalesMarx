<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>e-Wallet - Carteira Digital</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        #resultado { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Realizar Depósito</h2>
    <form id="formDeposito">
        <label for="contaId">ID da Conta:</label>
        <input type="number" id="contaId" value="1" required>

        <label for="valor">Valor do Depósito (R$):</label>
        <input type="number" id="valor" step="0.01" required>

        <button type="submit" id="btnDepositar">Depositar</button>
    </form>

    <div id="resultado"></div>

    <script>
        document.getElementById('formDeposito').addEventListener('submit', async function(e) {
            e.preventDefault();
            const contaId = document.getElementById('contaId').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const resultadoDiv = document.getElementById('resultado');

            const response = await fetch(`/api/contas/${contaId}/deposito`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: valor })
            });

            const data = await response.json();
            if (response.ok) {
                resultadoDiv.textContent = `Depósito realizado! Novo saldo: R$ ${data.saldo.toFixed(2)}`;
            } else {
                resultadoDiv.textContent = `Erro: ${data.erro}`;
            }
        });
    </script>
</body>
</html>
